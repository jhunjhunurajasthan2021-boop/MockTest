<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MockTest Pro</title>
    <link rel="icon" type="image/png" href="/logo.png" />
  </head>
  <body style="margin: 0; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('WebSocket')) return;
        console.error('Global error:', e);
      });
      window.addEventListener('unhandledrejection', function(e) {
        const reasonStr = String(e.reason || '');
        if (reasonStr.includes('WebSocket')) return;
        console.error('Unhandled rejection:', e.reason);
      });
    </script>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 20px;">
        <div style="width: 48px; height: 48px; border: 4px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 18px; font-weight: 800; margin: 0 0 8px 0; color: #ffffff;">MockTest Pro</h2>
        <p style="font-size: 12px; color: #94a3b8; margin: 0;">Loading examination platform & test series...</p>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
